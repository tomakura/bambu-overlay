name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Bambu Overlay ${{ github.ref_name }}"
          releaseBody: |
            Bambu Lab プリンター監視オーバーレイ

            ## インストール
            - **`_x64-setup.exe`** — NSlSインストーラー（推奨）
            - **`_x64.msi`** — MSIパッケージ

            ## 変更点
            See [CHANGELOG](https://github.com/${{ github.repository }}/commits/${{ github.ref_name }})
          releaseDraft: false
          prerelease: false
